<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>StockSmart - Sales Entry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>StockSmart</h1>
    <h2>Sales Entry / Checkout</h2>
    <h3>Never run out. Never run over.</h3>
  </div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="inventory.html">Inventory</a>
    <a href="sales.html" class="active">Sales</a>
    <a href="reports.html">Reports</a>
  </nav>
</header>

<main>
  <aside class="sections">
    <a href="sales.html" class="active">Add Item to Sale</a>
    <a href="current-sale.html">Current Sale</a>
  </aside>

  <section class="content">
    <h3>Add Item to Sale</h3>

    <!-- Interface only: database connection comes later -->
    <form action="#" method="get">

      <label for="productId">Product:</label>
      <select id="productId" name="productId" required>
        <option value="">Select Product</option>
        <option value="1">Whole Milk</option>
        <option value="7">Sourdough Bread</option>
        <option value="12">Ground Beef</option>
      </select>
      <br><br>

      <label for="quantitySold">Quantity Sold:</label>
      <input type="number" id="quantitySold"
             name="quantitySold"
             min="1" step="1" required>
      <br><br>

      <label for="unitPrice">Unit Price:</label>
      <input type="number" id="unitPrice"
             name="unitPrice"
             min="0" step="0.01" readonly>
      <br><br>

      <label for="unitCost">Unit Cost:</label>
      <input type="number" id="unitCost"
             name="unitCost"
             min="0" step="0.01" readonly>
      <br><br>

      <p class="note">
        Unit price and unit cost are copied from the Product table
        when the sale is recorded (filled in during Phase 4).
      </p>

      <button type="submit">Add Item</button>
      <button type="reset">Clear Form</button>
    </form>
  </section>
</main>

</body>
</html>
