<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>StockSmart - Reports</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>StockSmart</h1>
    <h2>Sales Reports</h2>
    <h3>Never run out. Never run over.</h3>

  </div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="inventory.html">Inventory</a>
    <a href="sales.html">Sales</a>
    <a href="reports.html" class="active">Reports</a>
  </nav>
</header>

<main>
  <aside class="sections">
    <a href="reports.html" class="active">Generate Report</a>
    <a href="report-summary.html">Report Summary</a>
  </aside>

  <section class="content">
    <h3>Generate Report</h3>

    <!-- Interface only: database connection comes later -->
    <form action="#" method="get">

      <label for="reportType">Report Type:</label>
      <select id="reportType" name="reportType" required>
        <option value="">Select Report Type</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <br><br>

      <label for="startDate">Start Date:</label>
      <input type="date" id="startDate"
             name="startDate" required>
      <br><br>

      <label for="endDate">End Date:</label>
      <input type="date" id="endDate"
             name="endDate" required>
      <br><br>

      <button type="submit">Generate Report</button>
      <button type="reset">Clear Form</button>
    </form>
  </section>
</main>

</body>
</html>
