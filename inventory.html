<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>StockSmart - Inventory Update</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>StockSmart</h1>
    <h2>Inventory Update</h2>
    <h3>Never run out. Never run over.</h3>
  </div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="inventory.html" class="active">Inventory</a>
    <a href="sales.html">Sales</a>
    <a href="reports.html">Reports</a>
  </nav>
</header>

<main>
  <aside class="sections">
    <a href="inventory.html" class="active">Update Inventory</a>
    <a href="inventory-results.html">Inventory Query Results</a>
  </aside>

  <section class="content">
    <h3>Update Inventory</h3>

    <!-- Interface only: database connection comes later -->
    <form action="#" method="get">

      <label for="productId">Product:</label>
      <select id="productId" name="productId" required>
        <option value="">Select Product</option>
        <option value="1">Whole Milk</option>
        <option value="7">Sourdough Bread</option>
        <option value="12">Ground Beef</option>
      </select>
      <br><br>

      <label for="quantity">Quantity in Stock:</label>
      <input type="number" id="quantity"
             name="quantity"
             min="0" step="1" required>
      <br><br>

      <label for="minStock">Minimum Stock Level:</label>
      <input type="number" id="minStock"
             name="minStock"
             min="0" step="1" required>
      <br><br>

      <button type="submit">Update Inventory</button>
      <button type="reset">Clear Form</button>
    </form>
  </section>
</main>

</body>
</html>
